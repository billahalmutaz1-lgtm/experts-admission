<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة القبول والتسجيل - مدارس إكسبريس الدولية</title>
    <style>
        body {
            font-family: 'Cairo', Tahoma, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h2 {
            text-align: center;
            color: #1a365d;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #2d3748;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #fff;
        }
        .form-control:focus {
            border-color: #3182ce;
            outline: none;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.1);
        }
        .btn-submit {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        .btn-submit:hover {
            background-color: #2b6cb0;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>استمارة القبول والتسجيل - مدارس إكسبريس الدولية</h2>
    
    <form id="admissionForm">
        <!-- حقل اختيار القسم الدراسي -->
        <div class="form-group">
            <label for="section">القسم الدراسي المتقدم له: *</label>
            <select id="section" name="section" required class="form-control">
                <option value="" disabled selected>-- اختر القسم الدراسي --</option>
                <option value="القسم العربي - المنهج السوداني القومي">القسم العربي (المنهج السوداني القومي)</option>
                <option value="القسم الإنترناشونال - منهج كامبريدج">القسم الإنترناشونال (منهج كامبريدج)</option>
                <option value="القسم أونلاين إنترناشونال - منهج كامبريدج">القسم أونلاين إنترناشونال (منهج كامبريدج)</option>
            </select>
        </div>

        <!-- اسم الطالب -->
        <div class="form-group">
            <label for="studentName">اسم الطالب الرباعي: *</label>
            <input type="text" id="studentName" name="studentName" required class="form-control" placeholder="أدخل اسم الطالب رباعياً">
        </div>

        <!-- الصف الدراسي -->
        <div class="form-group">
            <label for="grade">الصف المتقدم له: *</label>
            <input type="text" id="grade" name="grade" required class="form-control" placeholder="مثال: الصف الرابع الابتدائي">
        </div>

        <!-- اسم ولي الأمر -->
        <div class="form-group">
            <label for="guardianName">اسم ولي الأمر: *</label>
            <input type="text" id="guardianName" name="guardianName" required class="form-control" placeholder="أدخل اسم ولي الأمر">
        </div>

        <!-- رقم الهاتف -->
        <div class="form-group">
            <label for="phone">رقم الهاتف (واتساب): *</label>
            <input type="tel" id="phone" name="phone" required class="form-control" placeholder="أدخل رقم الهاتف للتواصل">
        </div>

        <button type="submit" class="btn-submit">إرسال طلب التسجيل</button>
    </form>
</div>

<script>
    // ضع رابط سكريبت جوجل شيت الخاص بك هنا عند الربط
    const scriptURL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE';

        alert('تم استلام بيانات الاستمارة بنجاح وسيتم جدولتها بحسب القسم المختيار.');

</script>

</body>
</html>
</html>
