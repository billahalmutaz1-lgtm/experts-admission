<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experts International School - Admission Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1e3a8a;
            --accent-color: #f59e0b;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); position: relative; }
        .lang-switch { position: absolute; top: 20px; left: 20px; background: var(--primary-color); color: #fff; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .header { text-align: center; margin-bottom: 30px; }
        .header img { width: 90px; height: 90px; object-fit: contain; margin-bottom: 10px; }
        .header h1 { font-size: 24px; color: var(--primary-color); margin-bottom: 5px; }
        .header p { color: #64748b; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; background: #fff; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(30,58,138,0.1); }
        button[type="submit"] { width: 100%; background: var(--primary-color); color: #fff; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; transition: background 0.3s; }
        button[type="submit"]:hover { background: #1e40af; }
        .success-msg { display: none; background: #dcfce7; color: #166534; padding: 15px; border-radius: 8px; text-align: center; font-weight: 600; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <button class="lang-switch" onclick="toggleLanguage()" id="langBtn">English</button>
    
    <div class="header">
        <img src="logo.png" alt="EIS Logo" onerror="this.style.display='none'">
        <h1 id="mainTitle">استمارة التقديم والقبول الإلكتروني</h1>
        <p id="subTitle">مدارس الخبراء العالمية - Experts International School</p>
    </div>

    <form id="admissionForm" onsubmit="submitForm(event)">
        <div class="form-group">
            <label id="lblStudent">اسم الطالب الرباعي:</label>
            <input type="text" id="studentName" required placeholder="أدخل اسم الطالب كاملاً">
        </div>

        <div class="form-group">
            <label id="lblSection">القسم الدراسي:</label>
            <select id="section" required>
                <option value="" disabled selected>-- اختر القسم الدراسي --</option>
                <option value="القسم العربي (السوداني)">القسم العربي (السوداني)</option>
                <option value="القسم الدولي (حضوري - كامبريدج)">القسم الدولي (حضوري - كامبريدج)</option>
                <option value="القسم الدولي (أونلاين - كامبريدج)">القسم الدولي (أونلاين - كامبريدج)</option>
            </select>
        </div>

        <div class="form-group">
            <label id="lblGrade">الصف المستهدف:</label>
            <select id="grade" required>
                <option value="" disabled selected>-- اختر الصف --</option>
                <option value="Grade 1">الصف الأول (Grade 1)</option>
                <option value="Grade 2">الصف الثاني (Grade 2)</option>
                <option value="Grade 3">الصف الثالث (Grade 3)</option>
                <option value="Grade 4">الصف الرابع (Grade 4)</option>
                <option value="Grade 5">الصف الخامس (Grade 5)</option>
                <option value="Grade 6">الصف السادس (Grade 6)</option>
                <option value="Grade 7">الصف السابع (Grade 7)</option>
                <option value="Grade 8">الصف الثمن (Grade 8)</option>
                <option value="Grade 9">الصف التاسع (Grade 9)</option>
                <option value="Grade 10">الصف العاشر (Grade 10)</option>
                <option value="Grade 11">الصف الحادي عشر (Grade 11)</option>
            </select>
        </div>

        <div class="form-group">
            <label id="lblParent">اسم ولي الأمر:</label>
            <input type="text" id="parentName" required placeholder="أدخل اسم ولي الأمر">
        </div>

        <div class="form-group">
            <label id="lblPhone">رقم الهاتف (واتساب):</label>
            <input type="tel" id="phone" required placeholder="05xxxxxxxx / 09xxxxxxxx">
        </div>

        <div class="form-group">
            <label id="lblNotes">ملاحظات إضافية (اختياري):</label>
            <textarea id="notes" rows="3" placeholder="أي تفاصيل أو استفسارات أخرى..."></textarea>
        </div>

        <button type="submit" id="submitBtn">إرسال طلب التسجيل</button>
    </form>

    <div id="successMessage" class="success-msg">تم إرسال طلبك بنجاح! سنتواصل معك قريباً.</div>
</div>

<script>
    // رابط جوجل شيت الخاص بك مثبت هنا تلقائياً
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwDJKjKBnOZzeGZ6h8HWxk1_6j_pd2UZAN7j-vRYXPjD3e9o_NNCD6uLeVf33dsUnK-/exec";

    let currentLang = 'ar';

    function toggleLanguage() {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        const html = document.documentElement;
        const btn = document.getElementById('langBtn');
        
        if(currentLang === 'en') {
            html.setAttribute('dir', 'ltr');
            html.setAttribute('lang', 'en');
            btn.innerText = 'العربية';
            document.getElementById('mainTitle').innerText = 'Online Admission Portal';
            document.getElementById('subTitle').innerText = 'Experts International School';
            document.getElementById('lblStudent').innerText = 'Full Student Name:';
            document.getElementById('lblSection').innerText = 'Academic Section:';
            document.getElementById('lblGrade').innerText = 'Target Grade:';
            document.getElementById('lblParent').innerText = "Parent's Name:";
            document.getElementById('lblPhone').innerText = 'Phone Number (WhatsApp):';
            document.getElementById('lblNotes').innerText = 'Additional Notes (Optional):';
            document.getElementById('submitBtn').innerText = 'Submit Application';
            document.getElementById('successMessage').innerText = 'Application submitted successfully! We will contact you soon.';
        } else {
            html.setAttribute('dir', 'rtl');
            html.setAttribute('lang', 'ar');
            btn.innerText = 'English';
            document.getElementById('mainTitle').innerText = 'استمارة التقديم والقبول الإلكتروني';
            document.getElementById('subTitle').innerText = 'مدارس الخبراء العالمية - Experts International School';
            document.getElementById('lblStudent').innerText = 'اسم الطالب الرباعي:';
            document.getElementById('lblSection').innerText = 'القسم الدراسي:';
            document.getElementById('lblGrade').innerText = 'الصف المستهدف:';
            document.getElementById('lblParent').innerText = 'اسم ولي الأمر:';
            document.getElementById('lblPhone').innerText = 'رقم الهاتف (واتساب):';
            document.getElementById('lblNotes').innerText = 'ملاحظات إضافية (اختياري):';
            document.getElementById('submitBtn').innerText = 'إرسال طلب التسجيل';
            document.getElementById('successMessage').innerText = 'تم إرسال طلبك بنجاح! سنتواصل معك قريباً.';
        }
    }

    function submitForm(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = currentLang === 'ar' ? 'جاري الإرسال...' : 'Submitting...';

        const data = {
            studentName: document.getElementById('studentName').value,
            section: document.getElementById('section').value,
            grade: document.getElementById('grade').value,
            parentName: document.getElementById('parentName').value,
            phone: document.getElementById('phone').value,
            notes: document.getElementById('notes').value
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        }).then(() => {
            document.getElementById('admissionForm').style.display = 'none';
            document.getElementById('successMessage').style.display = 'block';
        }).catch(() => {
            alert(currentLang === 'ar' ? 'حدث خطأ، يرجى المحاولة مرة أخرى.' : 'An error occurred, please try again.');
            btn.disabled = false;
            btn.innerText = currentLang === 'ar' ? 'إرسال طلب التسجيل' : 'Submit Application';
        });
    }
</script>

</body>
</html>
